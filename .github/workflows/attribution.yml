name: Attribution

# Runs separately from CI so that editing a PR description re-checks it without re-running the tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages and PR description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by|generated with|claude-session|claude\.ai/code'
          status=0
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -inE "$pattern"; then
            echo "::error::A commit message contains attribution text. See CLAUDE.md, 'Attribution'."
            status=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -inE "$pattern"; then
            echo "::error::The PR title or description contains attribution text. See CLAUDE.md, 'Attribution'."
            status=1
          fi
          exit $status
