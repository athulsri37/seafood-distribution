[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
# A known-bug test marked xfail fails the run once the bug is fixed, so the marker gets removed.
xfail_strict = true
# Deprecated Pydantic features (such as v1-style `class Config`) are removed in Pydantic v3,
# so using one fails the run instead of printing a warning that's easy to ignore.
filterwarnings =
    error::pydantic.warnings.PydanticDeprecationWarning
