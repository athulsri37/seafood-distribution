version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seafood
      POSTGRES_PASSWORD: seafood_dev_pw
      POSTGRES_DB: seafood_distribution
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://seafood:seafood_dev_pw@postgres:5432/seafood_distribution
      JWT_SECRET: change_this_secret_in_production
      PORT: 4000
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
